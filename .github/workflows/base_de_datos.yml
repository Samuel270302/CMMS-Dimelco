name: Actualizar base de datos

# Aplica en Supabase las migraciones del CMMS: ejecuta supabase/instalar_todo.sql, que se
# puede repetir sin daño, en una sola transacción (si algo falla no queda nada a medias)
# y después muestra la verificación.
# Solo a mano y con confirmación: la base del CMMS es el proyecto de backlog, que está en
# uso. Nada se aplica al hacer push.
# Usa el secreto SUPABASE_DB_URL (cadena de conexión del proyecto de backlog).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escriba APLICAR para ejecutar las migraciones en la base de producción'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: base-de-datos
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Confirmación
        if: inputs.confirmar != 'APLICAR'
        run: |
          echo "::error::No se aplicó nada: hay que escribir APLICAR en el campo de confirmación"
          exit 1
      - name: Verificar secreto
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Instalar cliente de PostgreSQL 17
        timeout-minutes: 6
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
      - name: Aplicar migraciones
        run: |
          PGOPTIONS="-c client_min_messages=warning" /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -q \
            -v ON_ERROR_STOP=1 --single-transaction -f supabase/instalar_todo.sql > /dev/null
          echo "Migraciones aplicadas"
      - name: Verificar instalación
        run: |
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -X -f tools/verificar_instalacion.sql
          falta=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -X -At -F'|' -f tools/verificar_instalacion.sql | awk -F'|' '$1<=13 && $3=="FALTA"')
          if [ -n "$falta" ]; then
            echo "::error::Puntos de la base en FALTA después de migrar: $falta"
            exit 1
          fi
