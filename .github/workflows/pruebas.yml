name: Pruebas

on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones y flujo de estados en PostgreSQL local
        run: tools/prueba_local.sh
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Ensayo de la copia de preventivos en PostgreSQL local
        run: tests/ensayo_traer_preventivos.sh
      - name: Órdenes de trabajo del tablero en PostgreSQL local
        run: tests/prueba_ot.sh
